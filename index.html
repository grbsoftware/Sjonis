<title>Sjonis — example browser</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* Deliberately NOT themed with --ui-*: the shell must stay visually quiet so the
   framed page owns the eye, and so switching the frame's theme never restyles the
   chrome around it. Same reasoning (and same token prefix) as demo/gallery.html. */
/* Dark is the default here, not a preference-follow: the shell is a frame around
   someone else's page, and a dark surround stops it competing with whatever is
   inside. data-theme on <html> always wins, and the inline script below sets it
   before first paint so there is no flash. */
:root{
  --g-bg:#0E1011; --g-raise:#15181A; --g-ink:#E8EAE9; --g-dim:#8A9296;
  --g-faint:#666E71; --g-line:#24282A; --g-line2:#333A3C; --g-accent:#7FB8A4;
  --g-sans:"Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;
  --g-mono:"Cascadia Mono",Consolas,ui-monospace,"SF Mono",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{--g-bg:#F7F8F7;--g-raise:#FFFFFF;--g-ink:#16181A;--g-dim:#5E6468;
        --g-faint:#8C9396;--g-line:#DFE2E1;--g-line2:#C8CDCB;--g-accent:#2F5D50;
        color-scheme:light}
:root[data-theme="dark"]{--g-bg:#0E1011;--g-raise:#15181A;--g-ink:#E8EAE9;--g-dim:#8A9296;
        --g-faint:#666E71;--g-line:#24282A;--g-line2:#333A3C;--g-accent:#7FB8A4;
        color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--g-bg);color:var(--g-ink);font-family:var(--g-sans);
     font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
     display:flex;flex-direction:column;overflow:hidden}

/* ---- masthead ------------------------------------------------------------ */
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
     padding:14px 20px 12px;border-bottom:1px solid var(--g-line);flex:none}
.top h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.top .sub{margin:0;font-size:12.5px;color:var(--g-dim)}
.top .note{margin:0 0 0 auto;font-size:11.5px;color:var(--g-faint);max-width:44ch;
           text-align:right;line-height:1.45}

/* ---- nav bar ------------------------------------------------------------- */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
     padding:10px 20px;border-bottom:1px solid var(--g-line);
     background:var(--g-raise);flex:none}
.pager{display:flex;align-items:center;gap:6px}
.count{font-family:var(--g-mono);font-size:11.5px;color:var(--g-faint);
       font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:center}

button{font:inherit;cursor:pointer}
.nav{width:30px;height:30px;display:grid;place-items:center;padding:0;
     background:var(--g-bg);border:1px solid var(--g-line2);border-radius:7px;
     color:var(--g-ink);font-size:14px;line-height:1}
.nav:hover{border-color:var(--g-accent);color:var(--g-accent)}
.nav:focus-visible{outline:2px solid var(--g-accent);outline-offset:1px}

.tabs{display:flex;gap:3px;background:var(--g-bg);border:1px solid var(--g-line);
      border-radius:8px;padding:3px;flex-wrap:wrap;min-width:0}
.tabs button{background:none;border:1px solid transparent;border-radius:5px;
  padding:5px 11px;font-size:12.5px;font-weight:550;color:var(--g-dim);white-space:nowrap}
.tabs button:hover{color:var(--g-ink)}
.tabs button[aria-current="page"]{background:var(--g-raise);border-color:var(--g-line2);color:var(--g-ink)}
.tabs button:focus-visible{outline:2px solid var(--g-accent);outline-offset:1px}

.widths{display:flex;gap:3px;margin-left:auto;background:var(--g-bg);
        border:1px solid var(--g-line);border-radius:8px;padding:3px}
.widths button{background:none;border:1px solid transparent;border-radius:5px;
  padding:5px 9px;font-family:var(--g-mono);font-size:11.5px;color:var(--g-dim)}
.widths button[aria-pressed="true"]{background:var(--g-raise);border-color:var(--g-line2);color:var(--g-ink)}
.widths button:focus-visible{outline:2px solid var(--g-accent);outline-offset:1px}

/* ---- stage --------------------------------------------------------------- */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 20px 18px}
.frame{flex:1;min-height:0;width:100%;margin:0 auto;
       display:flex;flex-direction:column;
       border:1px solid var(--g-line);border-radius:11px;overflow:hidden;
       background:var(--g-raise);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.frame-bar{display:flex;align-items:center;gap:9px;padding:8px 13px;flex:none;
  background:var(--g-raise);border-bottom:1px solid var(--g-line)}
.dot{width:9px;height:9px;border-radius:99px;background:var(--g-line2);flex:none}
.path{font-family:var(--g-mono);font-size:11.5px;color:var(--g-faint);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blurb{font-size:12px;color:var(--g-dim);margin-left:10px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.out{margin-left:auto;flex:none;font-size:11.5px;color:var(--g-accent);
     text-decoration:none;border-bottom:1px solid transparent;white-space:nowrap}
.out:hover{border-bottom-color:currentColor}

iframe{flex:1;min-height:0;width:100%;border:0;background:var(--g-raise);display:block}

/* Escape hatch: some browsers refuse to frame a local file. The frame sits on
   top of this, so if it never paints the reader still has a way through. */
.fallback{position:absolute;inset:auto;display:none}

/* ---- tuning strip ---- */
.tune-btn[aria-expanded="true"]{border-color:var(--g-accent);color:var(--g-accent)}
.tune{padding:12px 20px;border-bottom:1px solid var(--g-line);background:var(--g-raise);flex:none}
.tune-row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl > label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
             color:var(--g-faint);font-weight:600}
.seg{display:flex;gap:3px;background:var(--g-bg);border:1px solid var(--g-line);
     border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{background:none;border:1px solid transparent;border-radius:5px;
  padding:5px 10px;font:inherit;font-size:12px;font-weight:550;color:var(--g-dim);
  cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--g-ink)}
.seg button[aria-pressed="true"]{background:var(--g-raise);border-color:var(--g-line2);color:var(--g-ink)}
.seg button:focus-visible{outline:2px solid var(--g-accent);outline-offset:1px}
input[type="range"]{width:126px;accent-color:var(--g-accent)}
input[type="color"]{width:44px;height:28px;padding:2px;border:1px solid var(--g-line2);
  border-radius:6px;background:var(--g-bg);cursor:pointer}
.val{font-family:var(--g-mono);font-size:11px;color:var(--g-faint);
     font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
.tune-end{margin-left:auto}
.tune-acts{display:flex;gap:14px;align-items:center;height:28px}
.linkish{background:none;border:none;padding:0;font:inherit;font-size:12.5px;
  color:var(--g-accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tune-note{margin:10px 0 0;font-size:11.5px;color:var(--g-faint);min-height:1em}

/* ---- light/dark toggle ---- */
.mode{flex:none;width:30px;height:30px;display:grid;place-items:center;padding:0;
      background:var(--g-bg);border:1px solid var(--g-line2);border-radius:7px;
      color:var(--g-dim);line-height:1}
.mode:hover{border-color:var(--g-accent);color:var(--g-accent)}
.mode:focus-visible{outline:2px solid var(--g-accent);outline-offset:1px}
.mode svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;
          stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mode .i-sun{display:none}
:root[data-theme="light"] .mode .i-sun{display:block}
:root[data-theme="light"] .mode .i-moon{display:none}

@media (max-width:720px){
  .top .note{display:none}
  .widths{display:none}
  .mode{margin-left:auto}   /* .widths carried the auto margin; it's gone here */
}
</style>

<script>
/* Runs before any content paints, so a stored "light" never flashes dark first.
   Deliberately not in the main script block at the bottom — by then the page has
   already been painted once. */
(function(){
  var m;
  try { m = localStorage.getItem("sjonis-shell-mode"); } catch (e) {}
  document.documentElement.setAttribute("data-theme", m === "light" ? "light" : "dark");
})();
</script>

<header class="top">
  <h1>Sjonis</h1>
  <p class="sub">example browser</p>
  <p class="note">Ten examples, framed side by side. This outer frame is a viewer,
    not a design — the site-level shell that ties pages into one site is already in
    the suite, and five of the six skeletons share it unchanged.</p>
</header>

<nav class="bar">
  <div class="pager">
    <button class="nav" id="prev" type="button" title="Previous (←)" aria-label="Previous example">&#8592;</button>
    <span class="count" id="count">1/10</span>
    <button class="nav" id="next" type="button" title="Next (→)" aria-label="Next example">&#8594;</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <button class="nav tune-btn" id="tune-btn" type="button" aria-expanded="false"
          aria-controls="tune" title="Tune this page (T)" aria-label="Tune this page">&#9788;</button>
  <div class="widths" id="widths"></div>
  <button class="mode" id="mode" type="button" aria-pressed="false"
          title="Switch to light (D)" aria-label="Switch to light">
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
    </svg>
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2
               M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
    </svg>
  </button>
</nav>

<!-- Tuning strip. Hidden until asked for: the point of this page is to look at
     the examples, and a permanent wall of sliders would be the tail wagging
     the dog. -->
<div class="tune" id="tune" hidden>
  <div class="tune-row">
    <div class="ctl">
      <label>Theme</label>
      <div class="seg" id="seg-theme"></div>
    </div>
    <div class="ctl">
      <label for="rng-density">Density <span class="val" id="v-density">1.00</span></label>
      <input type="range" id="rng-density" min=".8" max="1.4" step=".01" value="1">
    </div>
    <div class="ctl">
      <label for="rng-radius">Radius <span class="val" id="v-radius">7px</span></label>
      <input type="range" id="rng-radius" min="0" max="20" step="1" value="7">
    </div>
    <div class="ctl">
      <label for="col-accent">Accent</label>
      <input type="color" id="col-accent" value="#2F6FE4">
    </div>
    <div class="ctl tune-end">
      <label>&nbsp;</label>
      <div class="tune-acts">
        <button class="linkish" id="tune-reset" type="button">Reset</button>
        <button class="linkish" id="tune-copy" type="button">Copy CSS</button>
      </div>
    </div>
  </div>
  <p class="tune-note" id="tune-note"></p>
</div>

<main class="stage">
  <div class="frame">
    <div class="frame-bar">
      <span class="dot"></span>
      <span class="path" id="path">—</span>
      <span class="blurb" id="blurb"></span>
      <a class="out" id="out" href="#" target="_blank" rel="noopener">open on its own &#8599;</a>
    </div>
    <iframe id="stage" title="Example preview"></iframe>
  </div>
</main>

<script>
(function () {
  /* Order: what you'd build first, then the tools, then the archive. */
  /* `mode` says HOW that page takes a light/dark instruction. Declared per page
     rather than sniffed, because the same attribute means two different things
     across the suite: on a skeleton `data-theme` names a suite theme
     ("vellum"), on a standalone demo page it names light or dark.
       "ui"     — page loads ui.js; ask it, so its own toggles stay in sync
       "mode"   — set data-mode on <html> and every element carrying data-theme
       "chrome" — page styles itself with :root[data-theme="dark"|"light"]      */
  var EXAMPLES = [
    { id:"app-shell",  label:"App shell",  src:"skeletons/app-shell.html", mode:"mode",
      blurb:"The admin skeleton — rail, toolbar, data table." },
    { id:"portfolio",  label:"Portfolio",  src:"skeletons/portfolio.html", mode:"ui",
      blurb:"The anti-admin — bands, justified gallery, marquee." },
    { id:"storefront", label:"Storefront", src:"skeletons/storefront.html", mode:"ui",
      blurb:"A catalogue — site frame, product grid, prices, quick look." },
    { id:"product",    label:"Product",    src:"skeletons/storefront-product.html", mode:"ui",
      blurb:"Page two of the same site — the frame reused, not rebuilt." },
    { id:"editorial",  label:"Editorial",  src:"skeletons/editorial.html", mode:"ui",
      blurb:"Long-form — columns, drop cap, pull quote, margin notes." },
    { id:"game",       label:"Game / HUD", src:"skeletons/game.html", mode:"ui",
      blurb:"Chrome overlaid on the art — stage, HUD slots, meters, leaderboard." },
    { id:"tuner",      label:"Tuner",      src:"demo/gallery.html", mode:"chrome",
      blurb:"Layout × theme × density/radius/accent, with CSS export." },
    { id:"behaviour",  label:"Behaviour",  src:"demo/behaviour.html", mode:"ui",
      blurb:"Layer 2 — every JS behaviour, live, in all six themes." },
    { id:"skins",      label:"Skins",      src:"demo/skins.html", mode:"chrome",
      blurb:"One markup, three skins — flat, bevel and cushion, across every theme." },
    { id:"specimens",  label:"Specimens",  src:"specimens/directions-01.html", mode:"chrome",
      blurb:"Five directions for one interface (iteration 01)." },
    /* A GENRE entry frames the REAL skeleton file and dresses it, rather than
       being a page of its own — a copy of app-shell.html wearing the genre
       would drift from app-shell.html within a session. `genre` is only an id;
       the composition it names is read from tokens/genres.json so it is stated
       in exactly one place. */
    { id:"control-panel", label:"Control panel", src:"skeletons/app-shell.html",
      mode:"mode", genre:"control-panel",
      blurb:"Genre one — the app shell as an instrument, not a document." },
    /* The sibling. Same skeleton, same theme, one skin apart — put them next to
       each other in the strip on purpose, because the pair is the argument. */
    { id:"control-surface", label:"Control surface", src:"skeletons/app-shell.html",
      mode:"mode", genre:"control-surface",
      blurb:"Genre two — the same instrument in the present tense." },
    { id:"riso", label:"Riso", src:"skeletons/portfolio.html",
      mode:"mode", genre:"riso",
      blurb:"Genre three — flat inks, no blending. The first imported palette." }
  ];

  /* ---- genres -------------------------------------------------------------
     Loaded, not hardcoded. index.html holding its own copy of "bevel on
     graphite dark" is the same duplication the genre entry above avoids, one
     level up. fetch() fails on file:// (opaque origin), and that is the
     designed degradation: the entry then frames the undressed skeleton, which
     is a real thing to look at rather than an error. */
  var GENRES = {};
  function loadGenres(){
    try {
      return fetch("tokens/genres.json")
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          (d && d.genres || []).forEach(function(g){ GENRES[g.id] = g; });
        })
        /* SAY SOMETHING. This used to be `.catch(function(){})`, on the
           reasoning that file:// has no origin to fetch from and an undressed
           skeleton is a fine degradation. Both halves are true and the silence
           was still wrong: every OTHER way this can fail — a typo in the JSON,
           a renamed file, a cached empty body — produces the identical blank
           result, so the one expected failure was hiding all the unexpected
           ones. A warning costs nothing on file:// and is the only signal
           anybody gets when the manifest is genuinely broken. */
        .catch(function(e){
          if (location.protocol !== "file:")
            console.warn("Sjonis: genre manifest did not load —", e);
        });
    } catch (e) { return null; }
  }

  /* UNDRESSING IS NOT OPTIONAL, and leaving it out was a real bug Gary found.
     Three entries frame the SAME file — app-shell, control-panel and
     control-surface are all skeletons/app-shell.html — so moving between any
     two of them does not reload anything (see show()). Dressing that can only
     be ADDED therefore strands the previous genre on the next entry: control
     panel walked into control surface still wearing bevel, and plain app-shell
     wore whichever genre you came from. Arriving from a DIFFERENT file always
     looked right, which is exactly why it read as a random fault.

     This restores rather than guesses. The values that were there before are
     stashed on the element itself at dressing time, so undressing puts a page
     back the way its author wrote it — a skeleton carries data-theme on <html>
     and class="ui" on <body>, but demo pages put both on one element, and
     blindly removing data-theme would strip the theme off those. No stash
     means we never dressed this document and there is nothing to undo. */
  var DRESS_MARK = "data-ui-dressed";
  var DRESS_ATTRS = ["data-theme", "data-mode", "data-skin", "data-genre"];

  function undressFrame(doc){
    var root = doc.querySelector("[" + DRESS_MARK + "]");
    if (root){
      var was = {};
      try { was = JSON.parse(root.getAttribute(DRESS_MARK)) || {}; } catch (e) {}
      DRESS_ATTRS.forEach(function(a){
        if (was[a] === null || was[a] === undefined) root.removeAttribute(a);
        else root.setAttribute(a, was[a]);
      });
      root.removeAttribute(DRESS_MARK);
    }
    var old = doc.querySelectorAll("link[data-injected]");
    for (var n = old.length - 1; n >= 0; n--) old[n].parentNode.removeChild(old[n]);
  }

  /* Dressing is four attributes and two stylesheets, applied to the framed
     document — the same four and two an author would write by hand, because
     there is no mechanism here that a hand-written page does not have. */
  function applyGenreToFrame(){
    var ex = EXAMPLES[i], g = ex.genre && GENRES[ex.genre];
    if (ex.genre && !g && Object.keys(GENRES).length)
      console.warn('Sjonis: no genre "' + ex.genre + '" in tokens/genres.json');
    try {
      var doc = frame.contentWindow && frame.contentWindow.document;
      if (!doc || !doc.documentElement) return;
      /* Always strip first, so this function states the WHOLE desired result
         rather than a difference from an unknown previous one. Running it
         twice for the same entry has to land in the same place, or the
         same-src path below would accumulate stylesheets. */
      undressFrame(doc);
      if (!g) return;   /* undressed IS the finished state for a plain entry */
      /* ON THE .ui ELEMENT, NOT <html> — this is trap 1 wearing a new hat, and
         it cost a round trip here. ui.css's derived block is `:root,.ui`, so it
         RE-DECLARES the four role tokens at the .ui level; a skin sitting on an
         ancestor is overwritten by it and does nothing at all, silently. The
         skeletons carry data-theme on <html> and class="ui" on <body>, which is
         fine for a theme (nothing re-declares palette tokens) and fatal for a
         skin. Measured on the live site before the fix: .ui-card was a 1px
         near-black box instead of a 2px bevel on the mid face. */
      var root = doc.querySelector(".ui") || doc.documentElement;
      /* Stash what the author wrote, before overwriting it. null means the
         attribute was absent, which undressFrame restores as absent. */
      var was = {};
      DRESS_ATTRS.forEach(function(a){ was[a] = root.getAttribute(a); });
      root.setAttribute(DRESS_MARK, JSON.stringify(was));

      root.setAttribute("data-theme", g.theme);
      root.setAttribute("data-mode",  g.mode);
      root.setAttribute("data-genre", g.id);
      /* "flat" is a skin — the default role tokens, which live in ui.css
         because something has to define them before any skin loads. It ships
         no stylesheet and sets no data-skin, because there is no rule for the
         attribute to match. A genre whose point of view is "no depth at all"
         has to be able to name that, and naming it must not 404. */
      var dressings = [["genre", "../genres/" + g.id + ".css"]];
      if (g.skin && g.skin !== "flat"){
        root.setAttribute("data-skin", g.skin);
        dressings.unshift(["skin", "../skins/" + g.skin + ".css"]);
      }
      dressings.forEach(function(pair){
        var l = doc.createElement("link");
        l.rel = "stylesheet";
        l.href = pair[1];
        l.setAttribute("data-injected", pair[0]);
        doc.head.appendChild(l);
      });
    } catch (e) { /* file:// — see loadGenres */ }
  }

  var WIDTHS = [
    { id:"fit",     label:"fit",  px:null },
    { id:"1280",    label:"1280", px:1280 },
    { id:"768",     label:"768",  px:768  },
    { id:"375",     label:"375",  px:375  }
  ];

  var frame = document.getElementById("stage");
  var box   = document.querySelector(".frame");
  var path  = document.getElementById("path");
  var blurb = document.getElementById("blurb");
  var out   = document.getElementById("out");
  var count = document.getElementById("count");
  var tabs  = document.getElementById("tabs");
  var wbar  = document.getElementById("widths");

  var i = 0;             /* current example */
  var w = "fit";         /* current width preset */

  function indexOfId(id){
    for (var n=0;n<EXAMPLES.length;n++) if (EXAMPLES[n].id === id) return n;
    return -1;
  }

  /* The hash IS the state, so the browser's own back/forward buttons walk the
     history of what you looked at. go() only writes the hash; hashchange does
     the work — one code path, and a pasted #portfolio link lands correctly. */
  function go(n, replace){
    n = (n + EXAMPLES.length) % EXAMPLES.length;
    var h = "#" + EXAMPLES[n].id;
    if (location.hash === h){ show(n); return; }
    if (replace && location.replace) location.replace(h);
    else location.hash = h;
  }

  function show(n){
    if (n !== i){ tune.density = tune.radius = tune.accent = null; }
    i = n;
    var ex = EXAMPLES[n];
    /* Reloading is what normally triggers the dressing, via the frame's load
       event. When the src is unchanged there IS no load event, so the frame
       has to be re-dressed here instead — three entries share
       skeletons/app-shell.html and moving between them would otherwise leave
       the previous entry's genre on screen. Not reloading is the right call
       (it would throw away scroll position and any state the page holds); the
       bug was assuming a reload always happens. */
    if (frame.getAttribute("src") !== ex.src) frame.setAttribute("src", ex.src);
    else { applyGenreToFrame(); applyModeToFrame(); }
    path.textContent  = ex.src;
    blurb.textContent = ex.blurb;
    out.setAttribute("href", ex.src);
    count.textContent = (n+1) + "/" + EXAMPLES.length;
    document.title = "Sjonis — " + ex.label;
    paintTabs();
  }

  function paintTabs(){
    tabs.innerHTML = "";
    EXAMPLES.forEach(function(ex, n){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = ex.label;
      if (n === i) b.setAttribute("aria-current", "page");
      b.addEventListener("click", function(){ go(n); });
      tabs.appendChild(b);
    });
  }

  function paintWidths(){
    wbar.innerHTML = "";
    WIDTHS.forEach(function(def){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = def.label;
      b.setAttribute("aria-pressed", String(def.id === w));
      b.addEventListener("click", function(){ w = def.id; applyWidth(); paintWidths(); });
      wbar.appendChild(b);
    });
  }

  function applyWidth(){
    var def = WIDTHS.filter(function(d){ return d.id === w; })[0];
    box.style.maxWidth = def.px ? def.px + "px" : "";
  }

  function fromHash(){
    var n = indexOfId((location.hash || "").replace("#",""));
    if (n < 0){ go(0, true); return; }
    show(n);
  }

  /* ---- light/dark, shell AND frame ----------------------------------------
     A dark surround with a white page inside it is worse than either alone, so
     the mode is global. The frame keeps its THEME (portfolio stays vellum) and
     only changes mode — the theme is the pairing the skeleton exists to show. */
  var modeBtn = document.getElementById("mode");

  function currentMode(){
    return document.documentElement.getAttribute("data-theme") === "light"
         ? "light" : "dark";
  }

  function paintMode(){
    var to = currentMode() === "light" ? "dark" : "light";
    modeBtn.setAttribute("aria-pressed", String(currentMode() === "light"));
    modeBtn.setAttribute("title", "Switch to " + to + " (D)");
    modeBtn.setAttribute("aria-label", "Switch to " + to);
  }

  /* Reaching into the frame needs same origin. On a server that holds; opened
     from disk every file:// document is its own opaque origin and this throws,
     so the shell still switches and the frame simply doesn't. Silent by design —
     there is no fix available from out here, and a warning per toggle is noise. */
  function applyModeToFrame(){
    var m = currentMode(), strat = EXAMPLES[i].mode, doc, win;
    try {
      win = frame.contentWindow;
      doc = win && win.document;
      if (!doc || !doc.documentElement) return;

      /* The frame's own scrollbar is painted by the UA, not by our CSS, so it
         stays light inside a dark page until color-scheme says otherwise. Set it
         first: it applies whichever branch below runs. */
      doc.documentElement.style.colorScheme = m;

      if (strat === "ui" && win.UI && typeof win.UI.setTheme === "function"){
        win.UI.setTheme(null, m);          /* keeps the page's own toggles honest */
        return;
      }
      if (strat === "chrome"){
        doc.documentElement.setAttribute("data-theme", m);
        return;
      }
      /* "mode", and the fallback when ui.js hasn't parsed yet */
      doc.documentElement.setAttribute("data-mode", m);
      var els = doc.querySelectorAll("[data-theme], .ui");
      for (var n = 0; n < els.length; n++) els[n].setAttribute("data-mode", m);
    } catch (e) { /* cross-origin: chrome-only, as above */ }
  }

  function toggleMode(){
    var next = currentMode() === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("sjonis-shell-mode", next); } catch (e) {}
    paintMode();
    applyModeToFrame();
  }

  modeBtn.addEventListener("click", toggleMode);

  /* ---- tuning ---------------------------------------------------------------
     The same reach-into-the-frame trick as the mode toggle, pointed at the other
     axis. This deliberately tunes the REAL skeleton files rather than miniature
     copies of them: demo/gallery.html has four hand-built mini-layouts that have
     to be kept in step with the skeletons by hand, and they never are.

     Only offered for pages that wear a suite theme. On demo/gallery.html and the
     specimen deck, data-theme means light/dark and there is nothing to retheme. */
  var THEMES = ["vanilla","blueprint","halo","graphite","oxide","vellum"];
  var tune = { theme:null, density:null, radius:null, accent:null };

  var tuneBox  = document.getElementById("tune");
  var tuneBtn  = document.getElementById("tune-btn");
  var tuneNote = document.getElementById("tune-note");
  var segTheme = document.getElementById("seg-theme");
  var rngD = document.getElementById("rng-density");
  var rngR = document.getElementById("rng-radius");
  var colA = document.getElementById("col-accent");
  var vD = document.getElementById("v-density");
  var vR = document.getElementById("v-radius");

  function tunable(){ return EXAMPLES[i].mode !== "chrome"; }

  /* The element a theme is written to differs by page: the skeleton puts
     data-theme on <html> or on body.ui. Find whichever one the page chose
     rather than assuming, and fall back to the .ui root. */
  function themeRoot(doc){
    return doc.querySelector("[data-theme]") || doc.querySelector(".ui") || doc.body;
  }

  function withFrame(fn){
    try {
      var doc = frame.contentWindow && frame.contentWindow.document;
      if (doc && doc.documentElement) fn(doc, frame.contentWindow);
    } catch (e) { /* cross-origin on file:// — see applyModeToFrame */ }
  }

  function applyTuneToFrame(){
    withFrame(function(doc){
      var el = themeRoot(doc);
      if (!el) return;
      if (tune.theme) el.setAttribute("data-theme", tune.theme);

      var s = el.style;
      ["--ui-density","--ui-radius","--ui-radius-sm","--ui-radius-lg",
       "--ui-accent","--ui-accent-hover","--ui-accent-ink"].forEach(function(p){
        s.removeProperty(p);
      });

      if (tune.density !== null) s.setProperty("--ui-density", tune.density);
      if (tune.radius !== null){
        s.setProperty("--ui-radius", tune.radius + "px");
        s.setProperty("--ui-radius-sm", Math.max(0, Math.round(tune.radius * .6)) + "px");
        s.setProperty("--ui-radius-lg", Math.round(tune.radius * 1.5) + "px");
      }
      if (tune.accent !== null){
        s.setProperty("--ui-accent", tune.accent);
        s.setProperty("--ui-accent-hover", shift(tune.accent, currentMode() === "dark" ? 22 : -26));
        s.setProperty("--ui-accent-ink", ink(tune.accent));
      }
    });
  }

  /* Which label reads better on the accent, black or white.

     The crossover is NOT 0.5, and it is not a matter of taste. White wins while
     1.05/(L+0.05) > (L+0.05)/0.05, i.e. until (L+0.05)^2 = 0.0525, so the
     boundary is L = sqrt(0.0525) - 0.05 = 0.1791. Anything above that is better
     served by black, and the gap gets large fast: at L = 0.435 (a mid ochre)
     white gives 2.17:1 and black gives 9.70:1. */
  var INK_CROSSOVER = Math.sqrt(0.0525) - 0.05;
  function ink(hex){
    var c = hex.replace("#","");
    var f = function(v){ v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); };
    var L = .2126*f(parseInt(c.slice(0,2),16)) +
            .7152*f(parseInt(c.slice(2,4),16)) +
            .0722*f(parseInt(c.slice(4,6),16));
    return L > INK_CROSSOVER ? "#0B0E12" : "#FFFFFF";
  }
  function shift(hex, amt){
    var c = hex.replace("#",""), o = "#";
    for (var n = 0; n < 3; n++){
      var v = parseInt(c.substr(n*2,2),16) + amt;
      o += Math.max(0, Math.min(255, v)).toString(16).padStart(2,"0");
    }
    return o;
  }

  /* Read the values actually in force, so the controls open showing the truth
     rather than a default that no longer matches what is on screen. */
  function readFrameDefaults(){
    var got = null;
    withFrame(function(doc, win){
      var el = themeRoot(doc);
      if (!el) return;
      var cs = win.getComputedStyle(el);
      got = {
        theme: el.getAttribute("data-theme"),
        density: (cs.getPropertyValue("--ui-density") || "1").trim(),
        radius: parseFloat(cs.getPropertyValue("--ui-radius")) || 0,
        accent: (cs.getPropertyValue("--ui-accent") || "#2F6FE4").trim()
      };
    });
    return got;
  }

  function hexOf(colour){
    if (/^#[0-9a-f]{6}$/i.test(colour)) return colour;
    var m = colour.match(/rgba?\(([^)]+)\)/i);
    if (!m) return "#2F6FE4";
    var p = m[1].split(",").map(parseFloat);
    return "#" + p.slice(0,3).map(function(v){
      return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,"0");
    }).join("");
  }

  function paintTune(){
    tuneBtn.hidden = false;
    segTheme.innerHTML = "";

    if (!tunable()){
      tuneNote.textContent =
        "This page is not themed by the suite — it styles its own chrome, so there is nothing to retheme.";
      [rngD, rngR, colA].forEach(function(el){ el.disabled = true; });
      return;
    }
    [rngD, rngR, colA].forEach(function(el){ el.disabled = false; });

    var live = readFrameDefaults();
    if (!live){
      tuneNote.textContent = "Opened from disk, so the frame is a separate origin and cannot be tuned. Works on the served site.";
      return;
    }

    THEMES.forEach(function(t){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = t;
      b.setAttribute("aria-pressed", String(t === live.theme));
      b.addEventListener("click", function(){
        tune.theme = t;
        /* A new theme brings its own density, radius and accent — keeping the
           previous sliders would silently attribute one theme's values to
           another, which is the whole point of the two-axis split. */
        tune.density = tune.radius = tune.accent = null;
        applyTuneToFrame(); paintTune();
      });
      segTheme.appendChild(b);
    });

    rngD.value = parseFloat(live.density) || 1;
    vD.textContent = (parseFloat(live.density) || 1).toFixed(2);
    rngR.value = live.radius;
    vR.textContent = Math.round(live.radius) + "px";
    colA.value = hexOf(live.accent);

    tuneNote.textContent = "Tuning " + EXAMPLES[i].src + " live. Nothing is saved — Copy CSS takes it with you.";
  }

  function cssBlock(){
    var lines = [];
    if (tune.density !== null) lines.push("  --ui-density:      " + tune.density + ";");
    if (tune.radius !== null){
      lines.push("  --ui-radius:       " + tune.radius + "px;");
      lines.push("  --ui-radius-sm:    " + Math.max(0, Math.round(tune.radius * .6)) + "px;");
      lines.push("  --ui-radius-lg:    " + Math.round(tune.radius * 1.5) + "px;");
    }
    if (tune.accent !== null){
      lines.push("  --ui-accent:       " + tune.accent.toUpperCase() + ";");
      lines.push("  --ui-accent-hover: " + shift(tune.accent, currentMode() === "dark" ? 22 : -26).toUpperCase() + ";");
      lines.push("  --ui-accent-ink:   " + ink(tune.accent) + ";");
    }
    var live = readFrameDefaults() || {};
    var theme = tune.theme || live.theme || "vanilla";
    if (!lines.length){
      return '/* No overrides — this is theme "' + theme + '" (' + currentMode() + ') as shipped.\n' +
             '   <html data-theme="' + theme + '" data-mode="' + currentMode() + '"> */';
    }
    return '/* Tuned from "' + theme + '". Load after themes.css. */\n' +
           '[data-theme="' + theme + '"]{\n' + lines.join("\n") + "\n}";
  }

  rngD.addEventListener("input", function(){
    tune.density = rngD.value; vD.textContent = parseFloat(rngD.value).toFixed(2);
    applyTuneToFrame();
  });
  rngR.addEventListener("input", function(){
    tune.radius = parseInt(rngR.value, 10); vR.textContent = rngR.value + "px";
    applyTuneToFrame();
  });
  colA.addEventListener("input", function(){
    tune.accent = colA.value; applyTuneToFrame();
  });

  document.getElementById("tune-reset").addEventListener("click", function(){
    tune = { theme:null, density:null, radius:null, accent:null };
    frame.setAttribute("src", EXAMPLES[i].src);   /* cleanest reset: reload it */
    tuneNote.textContent = "Reset to as-designed.";
  });

  document.getElementById("tune-copy").addEventListener("click", function(){
    var text = cssBlock();
    var done = function(){ tuneNote.textContent = "CSS copied to the clipboard."; };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallback(text); });
    } else fallback(text);
    function fallback(t){
      var ta = document.createElement("textarea");
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); }
      catch (e) { tuneNote.textContent = "Could not copy — here it is:\n" + t; }
      document.body.removeChild(ta);
    }
  });

  function toggleTune(){
    var open = tuneBox.hasAttribute("hidden");
    if (open){ tuneBox.removeAttribute("hidden"); paintTune(); }
    else tuneBox.setAttribute("hidden", "");
    tuneBtn.setAttribute("aria-expanded", String(open));
  }
  tuneBtn.addEventListener("click", toggleTune);

  /* Every navigation loads a fresh document in its designed mode, so re-apply.
     Genre first, then mode: the genre states a mode and the shell's global
     toggle is allowed to override it. That is not the genre carrying
     alternatives — it is exploration away from a stated position, and the
     surround being dark while the frame is light is the worse failure. */
  frame.addEventListener("load", function(){
    applyGenreToFrame();
    applyModeToFrame();
    if (tune.theme || tune.density !== null || tune.radius !== null || tune.accent !== null)
      applyTuneToFrame();
    if (!tuneBox.hasAttribute("hidden")) paintTune();
  });

  document.getElementById("prev").addEventListener("click", function(){ go(i-1); });
  document.getElementById("next").addEventListener("click", function(){ go(i+1); });

  /* Arrows only work while focus is in the shell — once you click into the frame
     the page inside owns the keyboard, and cross-origin file:// means we can't
     (and shouldn't) reach in to listen. */
  document.addEventListener("keydown", function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" ||
        (t && t.isContentEditable)) return;
    if (e.key === "ArrowLeft"){ e.preventDefault(); go(i-1); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); go(i+1); }
    else if (e.key === "d" || e.key === "D"){ e.preventDefault(); toggleMode(); }
    else if (e.key === "t" || e.key === "T"){ e.preventDefault(); toggleTune(); }
  });

  window.addEventListener("hashchange", fromHash);

  paintMode();
  paintWidths();
  applyWidth();
  fromHash();

  /* The manifest lands after the first frame has already loaded, so dress
     whatever is on screen once it arrives. Landing directly on
     #control-panel is the case this exists for. */
  var pending = loadGenres();
  if (pending && pending.then) pending.then(function(){
    applyGenreToFrame();
    applyModeToFrame();
  });
})();
</script>
